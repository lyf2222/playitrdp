name: lserver_luai

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # إعادة تشغيل تلقائية مجدولة كل 6 ساعات

jobs:
  setup-rdp-tunnel:
    runs-on: windows-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Download and Install Playit (Portable)
      run: |
        # تحميل النسخة المحمولة المباشرة والمتوافقة بنسبة 100% مع بيئة الأوامر السحابية
        Invoke-WebRequest -Uri "https://github.com" -OutFile "$env:USERPROFILE\playit.exe"

    - name: Enable Remote Desktop and Firewall
      run: |
        # 1. تفعيل بروتوكول الـ RDP في الريجستري
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # 2. فتح جدار الحماية للويندوز لاستقبال اتصال الـ RDP الخارجي
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP Port 3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
        
        # 3. تعيين كلمة المرور لحساب تسجيل الدخول (runneradmin)
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "admin@123" -Force)

    - name: Start Playit Tunnel (Background)
      env:
        PLAYIT_AUTH_KEY: ${{ secrets.PL }}
      run: |
        # تشغيل برنامج playit في الخلفية بنجاح
        Start-Process -FilePath "$env:USERPROFILE\playit.exe" -ArgumentList "--secret $env:PLAYIT_AUTH_KEY" -NoNewWindow

    - name: Keep the GitHub Action Runner Alive (6 Hours)
      run: |
        Write-Host "RDP Server is now running! Connect via your playit.gg address."
        # الحفاظ على تشغيل السيرفر حياً لمدة 6 ساعات متواصلة
        Start-Sleep -Seconds 21600  

    - name: Restart the Workflow Automatically
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        # كود الـ API لإعادة تشغيل السيرفر تلقائياً بدورة جديدة فور انتهاء الـ 6 ساعات
        $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
        }
        $body = '{"ref":"main"}'
        $apiUrl = "https://github.com"
        Invoke-RestMethod -Uri $apiUrl -Method Post -Headers $headers -Body $body -ContentType "application/json"
