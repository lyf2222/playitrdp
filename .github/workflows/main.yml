name: Windows RDP + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        net user runneradmin "Admin@123"

        Write-Host "RDP Enabled"

    - name: Download Cloudflared
      shell: powershell
      run: |

        Invoke-WebRequest `
          -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
          -OutFile "$env:USERPROFILE\cloudflared.exe"

        Write-Host "Cloudflared downloaded"

    - name: Start Tunnel
      shell: powershell
      run: |

        Start-Process `
          -FilePath "$env:USERPROFILE\cloudflared.exe" `
          -ArgumentList "tunnel --url rdp://localhost:3389" `
          -WindowStyle Hidden

        Start-Sleep -Seconds 15

        Write-Host "Tunnel started"

    - name: Show RDP Info
      shell: powershell
      run: |

        Write-Host "=========================="
        Write-Host "RDP READY"
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: Admin@123"
        Write-Host "=========================="

    - name: Keep Alive
      shell: powershell
      run: |

        Start-Sleep -Seconds 21600
