name: lserver_luai

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  setup-rdp-tunnel:
    runs-on: windows-latest

    steps:

    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Download and Install Playit
      shell: powershell
      run: |

        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        curl.exe -L `
          "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-amd64.exe" `
          -o "$env:USERPROFILE\playit.exe"

        Start-Sleep -Seconds 5

    - name: Enable Remote Desktop
      shell: powershell
      run: |

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop"

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Set-LocalUser `
          -Name "runneradmin" `
          -Password (
            ConvertTo-SecureString `
            -AsPlainText "admin@123" `
            -Force
          )

    - name: Start Playit Tunnel
      shell: powershell
      env:
        PLAYIT_AUTH_KEY: ${{ secrets.PL }}
      run: |

        Start-Process `
          -FilePath "$env:USERPROFILE\playit.exe" `
          -ArgumentList "--secret $env:PLAYIT_AUTH_KEY" `
          -WindowStyle Hidden

        Start-Sleep -Seconds 20

    - name: Keep the GitHub Action Runner Alive
      shell: powershell
      run: |

        Start-Sleep -Seconds 21600

    - name: Restart the Workflow Automatically
      if: always()
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |

        $repo = "${{ github.repository }}"

        $apiUrl = "https://api.github.com/repos/$repo/actions/workflows/main.yml/dispatches"

        $headers = @{
          Authorization = "Bearer $env:GITHUB_TOKEN"
          Accept        = "application/vnd.github+json"
        }

        $body = @{
          ref = "main"
        } | ConvertTo-Json

        Invoke-RestMethod `
          -Uri $apiUrl `
          -Method Post `
          -Headers $headers `
          -Body $body `
          -ContentType "application/json"
